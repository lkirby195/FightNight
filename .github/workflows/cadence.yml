# The weekly card loop, unattended. cadence.py does the work (see its
# docstring); this file only schedules it, commits what it changed and pushes
# to main, which Vercel deploys. A run with nothing to do commits nothing.
#
#   Thu 09:23 Mountain  report  capture the weekend card's lines, post picks
#   Fri 09:23           report --final   fallback; a card still not posted = failure
#   Sun 09:23           settle  scrape results, ledger, replay gate, settle, rebuild
#   Mon 09:23           settle --final   fallback; results still missing = failure
#
# Cron is UTC: 16:23 UTC is 09:23 MST (10:23 in daylight time).
# Any failure opens (or comments on) a "Cadence failed" issue that mentions
# the repo owner, so it lands in their inbox. Run by hand from the Actions tab
# ("Run workflow") with any command; dry_run resolves the card and checks the
# gate without writing anything.
name: Weekly cadence

on:
  schedule:
    - cron: "23 16 * * 4"
    - cron: "23 16 * * 5"
    - cron: "23 16 * * 0"
    - cron: "23 16 * * 1"
  workflow_dispatch:
    inputs:
      command:
        description: "report (Thursday capture) or settle (Sunday results)"
        type: choice
        options: [report, settle]
        required: true
      final:
        description: "treat 'not ready yet' as a failure"
        type: boolean
        default: false
      dry_run:
        description: "report only: resolve the card and check the gate, write nothing"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: cadence
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: America/Denver
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned versions (they reproduce the committed data)
        run: pip install -r requirements-lock.txt

      - name: Pick the command
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            cmd="${{ inputs.command }}"; final="${{ inputs.final }}"; dry="${{ inputs.dry_run }}"
          else
            dry=false
            case "${{ github.event.schedule }}" in
              "23 16 * * 4") cmd=report; final=false ;;
              "23 16 * * 5") cmd=report; final=true ;;
              "23 16 * * 0") cmd=settle; final=false ;;
              "23 16 * * 1") cmd=settle; final=true ;;
              *) echo "unknown schedule ${{ github.event.schedule }}"; exit 1 ;;
            esac
          fi
          args="$cmd"
          [ "$final" = "true" ] && args="$args --final"
          [ "$dry" = "true" ] && args="$args --dry-run"
          echo "cmd=$cmd" >> "$GITHUB_OUTPUT"
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: cadence.py ${{ steps.pick.outputs.args }}
        run: python cadence.py ${{ steps.pick.outputs.args }} --commit-msg "$RUNNER_TEMP/commit-msg.txt"

      - name: Tests
        if: hashFiles('tests/**') != ''
        run: python -m pytest -q

      - name: Commit and push
        run: |
          if [ ! -s "$RUNNER_TEMP/commit-msg.txt" ]; then
            echo "Nothing to commit."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/out site/state
          if git diff --cached --quiet; then echo "No file changed."; exit 0; fi
          git commit -q -F "$RUNNER_TEMP/commit-msg.txt"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              git log -1 --format='Pushed %h: %s' | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "push failed"; exit 1

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const what = "${{ steps.pick.outputs.args }}" || "cadence";
            const title = "Cadence failed";
            const body = `@${context.repo.owner} the weekly cadence failed: \`cadence.py ${what}\` `
              + `(${context.eventName}, ${new Date().toISOString().slice(0, 16)}Z).\n\n`
              + `Log: ${run}\n\nNothing was pushed, so the site still shows the last good build. `
              + `Fix, then re-run from the Actions tab (Run workflow).`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 50 });
            const hit = open.data.find(i => i.title === title && !i.pull_request);
            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: hit.number, body });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
